[project]
name = "part107-rag"
version = "0.1.0"
description = "Zero-framework hybrid RAG over FAA Part 107 / Part 89 regulations (numpy + rank-bm25 + requests)."
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pypdf",
    "numpy",
    "rank-bm25",
    "python-dotenv",
    "google-genai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
